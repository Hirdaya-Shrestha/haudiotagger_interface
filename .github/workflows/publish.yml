name: Publish to pub.dev

# Publishes the pure-Dart contract package. No native builds needed.
# Tag as v<version>, e.g. v0.2.0 (must match pubspec.yaml). Requires
# pub.dev trusted publishing (OIDC) configured for haudiotagger_interface.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Verify tag matches pubspec
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep -oP '^version: \K\d+\.\d+\.\d+' pubspec.yaml)
          test "$VERSION" = "$PUBSPEC" || \
            (echo "Tag $VERSION != pubspec $PUBSPEC" && exit 1)
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # with:
    #   working-directory: path/to/package/within/repository
